packages:
  - "packages/*"
  - "apps/*"
# 显式开启 workspace 链接（pnpm 11 默认关闭，仅 workspace:* 才 link）：
# koishi 子仓库用 ~0.0.x 版本范围（非 workspace:*，因需独立发 npm），
# 依赖版本匹配 workspace 包时 link 本地源码——否则开发时只能解析到 npm
# 已发布旧版（新功能如 IPC 契约在未发布前无法被 koishi 消费）。
linkWorkspacePackages: true
# pnpm 11 构建脚本审批：允许这些依赖运行 postinstall（esbuild/parcel 需要）
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
# pnpm 11 supply-chain 校验（lockfile verify pass）跳过开关：本仓库 lockfile
# 由自己维护（自产自销 monorepo），视为可信基础。
# 背景：pnpm 11.6.0 的 verify pass 不读取 pnpm-workspace.yaml 的
# minimumReleaseAgeExclude（疑似 bug，环境变量/CLI 才生效），导致 release 流程
# 嵌套 install 时刚发布的 @napuketto/* 包（< 默认 1440 分钟发布龄）被拦截，
# 报 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION。trustLockfile: true 直接跳过该校验。
trustLockfile: true
minimumReleaseAgeExclude:
  - '@napuketto/kernel@0.0.3'
  - '@napuketto/kernel@0.0.4'
  - '@napuketto/loader@0.0.6'
  - '@napuketto/loader@0.0.7'
  - '@napuketto/kernel@0.0.6'
  - '@napuketto/loader@0.0.8'
  - '@napuketto/kernel@0.0.7'
  - '@napuketto/loader@0.0.9'
  - '@napuketto/kernel@0.0.8'
  - '@napuketto/loader@0.0.10'
  - '@napuketto/loader@0.0.11'
  - '@napuketto/kernel@0.0.10'
  - '@napuketto/loader@0.0.12'
  - '@napuketto/loader@0.0.13'
  - '@napuketto/loader@0.0.14'
settings:
  # pnpm 11 的 verify-deps-before-run 预检：每次命令前自动 reinstall，在 git
  # submodule monorepo（koishi-plugin-adapter 子仓库）场景触发失败。关闭预检，
  # 按需手动 pnpm install（开发工作流不受影响）。
  verifyDepsBeforeRun: false
